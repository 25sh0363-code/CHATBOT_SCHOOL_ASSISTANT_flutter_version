name: Build Windows Release Artifact

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master
    paths:
      - mobile_app/**
      - .github/workflows/windows-zip.yml

jobs:
  build-windows-zip:
    runs-on: windows-latest
    defaults:
      run:
        shell: pwsh
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Flutter diagnostics
        working-directory: mobile_app
        run: |
          New-Item -ItemType Directory -Force -Path ../artifacts | Out-Null
          flutter --version
          flutter doctor -v

      - name: Enable Windows desktop
        working-directory: mobile_app
        run: flutter config --enable-windows-desktop

      - name: Ensure Windows platform files
        working-directory: mobile_app
        run: |
          if (!(Test-Path "windows")) {
            Write-Host "Windows folder not found; generating platform files..."
            flutter create --platforms=windows .
          } else {
            Write-Host "Windows platform folder already exists."
          }

      - name: Flutter pub get
        working-directory: mobile_app
        run: flutter pub get

      - name: Build Windows release
        working-directory: mobile_app
        run: |
          $buildLog = "../artifacts/flutter-build-windows.log"
          flutter build windows --release -v 2>&1 | Tee-Object -FilePath $buildLog
          if ($LASTEXITCODE -ne 0) {
            Write-Host "Flutter build failed. See $buildLog for full output."
            exit $LASTEXITCODE
          }

      - name: Create Windows zip artifact
        run: |
          $releaseDir = "mobile_app/build/windows/x64/runner/Release"
          if (!(Test-Path $releaseDir)) {
            throw "Build output not found at $releaseDir"
          }

          $exePath = Get-ChildItem -Path $releaseDir -Filter *.exe -File | Select-Object -First 1
          if ($null -eq $exePath) {
            throw "No executable found in $releaseDir"
          }
          Write-Host "Detected executable: $($exePath.FullName)"

          New-Item -ItemType Directory -Force -Path "artifacts" | Out-Null
          $zipPath = "artifacts/sinovate-windows-latest.zip"
          if (Test-Path $zipPath) {
            Remove-Item $zipPath -Force
          }

          Compress-Archive -Path "$releaseDir\*" -DestinationPath $zipPath -Force
          Write-Host "Created $zipPath"

      - name: Upload zip artifact
        uses: actions/upload-artifact@v4
        with:
          name: sinovate-windows-latest
          path: artifacts/sinovate-windows-latest.zip
          if-no-files-found: error

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: windows-build-log
          path: artifacts/flutter-build-windows.log
          if-no-files-found: warn
