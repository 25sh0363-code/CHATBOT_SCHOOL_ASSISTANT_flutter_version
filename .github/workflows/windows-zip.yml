name: Build Windows Release Artifact

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master
    paths:
      - mobile_app/**
      - .github/workflows/windows-zip.yml

jobs:
  build-windows-zip:
    runs-on: windows-latest
    defaults:
      run:
        shell: pwsh
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Flutter diagnostics
        working-directory: mobile_app
        run: |
          New-Item -ItemType Directory -Force -Path ../artifacts | Out-Null
          flutter --version
          flutter doctor -v

      - name: Enable Windows desktop
        working-directory: mobile_app
        run: flutter config --enable-windows-desktop

      - name: Ensure Windows platform files
        working-directory: mobile_app
        run: |
          if (!(Test-Path "windows")) {
            Write-Host "Windows folder not found; generating platform files..."
            flutter create --platforms=windows .
          } else {
            Write-Host "Windows platform folder already exists."
          }

      - name: Flutter pub get
        working-directory: mobile_app
        run: flutter pub get

      - name: Build Windows release
        working-directory: mobile_app
        run: |
          $buildLog = "../artifacts/flutter-build-windows.log"
          flutter build windows --release -v 2>&1 | Tee-Object -FilePath $buildLog
          if ($LASTEXITCODE -ne 0) {
            Write-Host "Flutter build failed. See $buildLog for full output."
            exit $LASTEXITCODE
          }

      - name: Debug Release Directory
        run: |
          $releaseDir = "mobile_app/build/windows/x64/runner/Release"
          Write-Host "Listing contents of $releaseDir"
          Get-ChildItem -Path $releaseDir -Recurse

      - name: Create Windows zip artifact
        run: |
          $releaseDir = "mobile_app/build/windows/x64/runner/Release"
          if (!(Test-Path $releaseDir)) {
            throw "Build output not found at $releaseDir"
          }

          $exePath = Get-ChildItem -Path $releaseDir -Filter *.exe -File | Select-Object -First 1
          if ($null -eq $exePath) {
            throw "No executable found in $releaseDir"
          }
          Write-Host "Detected executable: $($exePath.FullName)"

          New-Item -ItemType Directory -Force -Path "artifacts" | Out-Null
          $zipPath = "artifacts/sinovate-windows-latest.zip"
          if (Test-Path $zipPath) {
            Remove-Item $zipPath -Force
          }

          Compress-Archive -Path "$releaseDir\*" -DestinationPath $zipPath -Force
          Write-Host "Created $zipPath"

      - name: Build Windows installer
        run: |
          $releaseDir = "${{ github.workspace }}\mobile_app\build\windows\x64\runner\Release"
          New-Item -ItemType Directory -Force -Path "artifacts" | Out-Null
          $installerLog = "artifacts/installer-build.log"

          if (!(Test-Path $releaseDir)) {
            throw "Build output not found at $releaseDir"
          }

          $exePath = Get-ChildItem -Path $releaseDir -Filter *.exe -File | Select-Object -First 1
          if ($null -eq $exePath) {
            throw "No executable found for installer in $releaseDir"
          }

          $isccPath = "C:\Program Files (x86)\Inno Setup 6\ISCC.exe"
          if (!(Test-Path $isccPath)) {
            choco install innosetup --no-progress -y
          }
          if (!(Test-Path $isccPath)) {
            throw "Inno Setup compiler not found at $isccPath"
          }

          $issPath = "artifacts/sinovate-installer.iss"
          $issLines = @(
            '[Setup]',
            'AppId={{7ABF6AE8-94D4-4F3B-A7C4-68F7B4F2F028}',
            'AppName=SINOVATE',
            'AppVersion=1.0.0',
            'DefaultDirName={autopf}\SINOVATE',
            'DefaultGroupName=SINOVATE',
            "OutputDir=${{ github.workspace }}\artifacts",
            'OutputBaseFilename=sinovate-windows-installer',
            'Compression=lzma',
            'SolidCompression=yes',
            'WizardStyle=modern',
            '',
            '[Languages]',
            'Name: "english"; MessagesFile: "compiler:Default.isl"',
            '',
            '[Files]',
            "Source: `"$releaseDir\*`"; DestDir: ""{app}""; Flags: recursesubdirs createallsubdirs ignoreversion",
            '',
            '[Icons]',
            "Name: `"{autoprograms}\SINOVATE`"; Filename: `"{app}\$($exePath.Name)`"",
            "Name: `"{autodesktop}\SINOVATE`"; Filename: `"{app}\$($exePath.Name)`"; Tasks: desktopicon",
            '',
            '[Tasks]',
            'Name: "desktopicon"; Description: "Create a desktop icon"; GroupDescription: "Additional icons:"',
            '',
            '[Run]',
            "Filename: `"{app}\$($exePath.Name)`"; Description: `"Launch SINOVATE`"; Flags: nowait postinstall skipifsilent"
          )
          $issLines | Set-Content -Path $issPath -Encoding utf8

          & $isccPath $issPath 2>&1 | Tee-Object -FilePath $installerLog
          if ($LASTEXITCODE -ne 0) {
            Write-Host "Installer build failed. See $installerLog for details."
            exit $LASTEXITCODE
          }

      - name: Upload zip artifact
        uses: actions/upload-artifact@v4
        with:
          name: sinovate-windows-latest
          path: artifacts/sinovate-windows-latest.zip
          if-no-files-found: error

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: windows-build-log
          path: artifacts/flutter-build-windows.log
          if-no-files-found: warn

      - name: Upload installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: sinovate-windows-installer
          path: artifacts/sinovate-windows-installer.exe
          if-no-files-found: error

      - name: Upload installer log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: windows-installer-log
          path: artifacts/installer-build.log
          if-no-files-found: warn